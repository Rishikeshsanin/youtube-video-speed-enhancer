    <g fill="#181e29" stroke="#3b4351">
      <rect x="24" y="548" width="112" height="48" rx="14"/><rect x="146" y="548" width="112" height="48" rx="14"/><rect x="268" y="548" width="112" height="48" rx="14"/><rect x="390" y="548" width="112" height="48" rx="14"/><rect x="512" y="548" width="116" height="48" rx="14"/>
      <rect x="24" y="606" width="112" height="48" rx="14"/><rect x="146" y="606" width="112" height="48" rx="14"/><rect x="268" y="606" width="112" height="48" rx="14"/><rect x="390" y="606" width="112" height="48" rx="14"/><rect x="512" y="606" width="116" height="48" rx="14"/>
    </g>
    <g fill="#fff" font-size="15" font-weight="700" text-anchor="middle">
      <text x="80" y="578">0.5×</text><text x="202" y="578">1×</text><text x="324" y="578">1.5×</text><text x="446" y="578">2×</text><text x="570" y="578">3×</text>
      <text x="80" y="636">4×</text><text x="202" y="636">6×</text><text x="324" y="636">8×</text><text x="446" y="636">12×</text><text x="570" y="636">16×</text>
