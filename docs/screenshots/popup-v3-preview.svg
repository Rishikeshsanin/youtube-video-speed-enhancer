<svg width="720" height="980" viewBox="0 0 720 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Video Speed Enhancer V3 popup preview</title>
  <desc id="desc">Stylized vector preview of the V3 extension popup with effective-rate telemetry and sixteen-times playback support.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="0.8" cy="0" r="0.7"><stop stop-color="#4b1520"/><stop offset="1" stop-color="#080a0f"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-opacity=".48"/></filter>
  </defs>
  <rect width="720" height="980" rx="32" fill="url(#bgGlow)"/>
  <g transform="translate(34 34)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="78" height="78" rx="24" fill="#35161d" stroke="#71303a"/>
    <circle cx="39" cy="39" r="27" fill="#ff4545"/><path d="M31 25l28 14-28 14z" fill="#fff"/>
    <text x="98" y="27" fill="#ff7a7a" font-size="17" font-weight="700" letter-spacing="2">YOUTUBE TOOL</text>
    <rect x="247" y="8" width="42" height="24" rx="12" fill="#2d161a" stroke="#673037"/><text x="268" y="25" text-anchor="middle" fill="#ff9797" font-size="12" font-weight="800">V3</text>
    <text x="98" y="64" fill="#fff" font-size="34" font-weight="800">Speed Enhancer</text>
    <circle cx="630" cy="38" r="10" fill="#42d8a0"/><circle cx="630" cy="38" r="20" fill="none" stroke="#42d8a0" opacity=".13" stroke-width="10"/>

    <rect x="0" y="104" width="652" height="64" rx="18" fill="#10211d" stroke="#275247"/>
    <text x="22" y="143" fill="#b7f5db" font-size="17">●  Synced at 8.00× · reset guard active</text>

