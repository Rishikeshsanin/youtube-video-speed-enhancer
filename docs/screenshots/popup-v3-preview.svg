    <text x="24" y="742" fill="#edf2f7" font-size="19" font-weight="700">Keyboard step</text><text x="24" y="768" fill="#8f9bad" font-size="14">Amount changed by + and −</text>
    <rect x="526" y="720" width="102" height="48" rx="14" fill="#181e29" stroke="#3b4351"/><text x="577" y="750" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">0.25×</text>
    <line x1="24" y1="786" x2="628" y2="786" stroke="#292f3a"/>
    <text x="24" y="823" fill="#edf2f7" font-size="19" font-weight="700">On-screen indicator</text><text x="432" y="823" fill="#8f9bad" font-size="14">Show changes over video</text>
    <rect x="570" y="802" width="58" height="32" rx="16" fill="#ff4545"/><circle cx="612" cy="818" r="12" fill="#fff"/>

    <text x="4" y="902" fill="#8f9bad" font-size="13">+ Faster   − Slower   \ Reset</text><text x="648" y="902" text-anchor="end" fill="#8f9bad" font-size="13">V3 engine · locked</text>
