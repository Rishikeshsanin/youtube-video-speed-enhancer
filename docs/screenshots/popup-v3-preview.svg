    <text x="24" y="232" fill="#edf2f7" font-size="22" font-weight="700">Playback speed</text>
    <text x="24" y="258" fill="#8f9bad" font-size="15">Fine control from 0.25× to 16×</text>
    <text x="622" y="238" text-anchor="end" fill="#fff" font-size="44" font-weight="800">8.00×</text>
    <rect x="470" y="255" width="152" height="28" rx="14" fill="#10211d" stroke="#275247"/>
    <circle cx="486" cy="269" r="5" fill="#42d8a0"/><text x="499" y="275" fill="#b7f5db" font-size="12">Effective 8.00×</text>
    <rect x="24" y="316" width="604" height="9" rx="5" fill="#2a303b"/><rect x="24" y="316" width="514" height="9" rx="5" fill="#ff4545"/><circle cx="538" cy="320" r="16" fill="#ff4545" stroke="#fff" stroke-width="5"/>
    <rect x="24" y="356" width="80" height="66" rx="18" fill="#181e29" stroke="#3b4351"/><text x="64" y="398" text-anchor="middle" fill="#fff" font-size="34">−</text>
    <rect x="118" y="356" width="416" height="66" rx="18" fill="#181e29" stroke="#3b4351"/><text x="326" y="398" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">8.00 ×</text>
    <rect x="548" y="356" width="80" height="66" rx="18" fill="#181e29" stroke="#3b4351"/><text x="588" y="398" text-anchor="middle" fill="#fff" font-size="34">+</text>

    <rect x="0" y="484" width="652" height="190" rx="24" fill="#11151d" stroke="#2a303b"/>
