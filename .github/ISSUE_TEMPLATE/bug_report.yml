name: Bug report
description: Report a reproducible extension or playback problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make playback control more reliable.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Brave 1.xx / Chrome 1xx / Edge 1xx
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: requested
    attributes:
      label: Requested speed
      placeholder: 4x
  - type: textarea
    id: observed
    attributes:
      label: What actually happened?
      description: Include whether the popup value changed and whether the video speed changed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open a YouTube video
        2. Open the extension
        3. Select 4x
        4. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console output
      render: shell
