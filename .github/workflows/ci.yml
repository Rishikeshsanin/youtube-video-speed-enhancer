name: Extension checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json > /dev/null

      - name: Run extension test suite
        run: npm test

      - name: Build extension ZIP
        run: npm run package

      - name: Upload installable build
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-speed-enhancer-v3
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
